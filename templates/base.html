<!doctype html>
<html lang="$lang">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$page_title</title>
<meta name="description" content="$description">
<link rel="canonical" href="$canonical">
$alternates
<meta property="og:type" content="website">
<meta property="og:title" content="$page_title">
<meta property="og:description" content="$description">
<meta property="og:url" content="$canonical">
<meta property="og:locale" content="$og_locale">
<link rel="icon" href="$asset_base/brand/favicon.png">
<link rel="stylesheet" href="$asset_base/style.css">
</head>
<body class="$body_class"$body_style>
<a class="skip-link" href="#main">$skip</a>
<header class="site-header">
  <a class="site-header__brand" href="$home_url" aria-label="$site_short">
    <picture>
      <source srcset="$asset_base/brand/item-logo-dark.png" media="(prefers-color-scheme: dark)">
      <img class="site-header__logo" src="$asset_base/brand/item-logo.png" alt="$site_short" width="647" height="207">
    </picture>
  </a>
  <nav class="site-nav" aria-label="$nav_label">
    <ul class="site-nav__list">
$nav_items
    </ul>
    <a class="site-nav__lang" href="$switch_url" hreflang="$other_lang" lang="$other_lang" aria-label="$switch_label">$switch_text</a>
  </nav>
</header>
<main id="main" class="site-main">
$content
</main>
<footer class="site-footer">
  <div class="site-footer__org">
    <p class="site-footer__name">$site_name</p>
    <p class="site-footer__address">$address</p>
    <p class="site-footer__email"><a href="mailto:$email">$email</a></p>
  </div>
  <dl class="site-footer__legal">
    <div><dt>$reg_label</dt><dd>$reg_no</dd></div>
    <div><dt>$tax_label</dt><dd>$tax_no</dd></div>
    <div><dt class="visually-hidden">$public_benefit</dt><dd>$public_benefit</dd></div>
  </dl>
  <p class="site-footer__copy">© $founded–$year $site_short</p>
</footer>
$scripts
</body>
</html>
