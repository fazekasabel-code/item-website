<article class="project project--$type" data-slug="$slug">
  <header class="project-hero">
    <div class="project-hero__text">
      <p class="project-hero__kicker"><span class="project-hero__type">$type_label</span> <span class="project-hero__years">$years</span></p>
      <h1 class="project-hero__title">$title</h1>
      <p class="project-hero__summary">$summary</p>
    </div>
    <div class="project-hero__media">
$media
    </div>
  </header>
  <div class="project-layout">
    <aside class="project-facts">
      <dl class="facts">
$facts
      </dl>
    </aside>
    <div class="project-body">
$role_note
$body
    </div>
  </div>
$books_section
$funding_section
  <nav class="project-pager" aria-label="$pager_label">
$pager
  </nav>
</article>
